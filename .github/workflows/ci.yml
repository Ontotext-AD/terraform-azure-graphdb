name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze:
    name: Analyze the Terraform scripts
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - id: clone_repository
        name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup_terraform
        name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - id: run_terraform_init
        name: Run Terraform init
        run: terraform init

      - id: run_terraform_fmt
        name: Run Terraform format check
        run: terraform fmt -check -recursive

      - id: run_terraform_validate
        name: Run Terraform validate check
        run: terraform validate

      - id: run_trivy_config
        name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          trivy-config: trivy.yaml
          ignore-unfixed: true
          hide-progress: false
          format: sarif
          output: trivy.sarif

      - id: run_sarif_upload
        name: Upload Trivy SARIF results
        uses: github/codeql-action/upload-sarif@bc0b696b4103f5fe60f15749af68a046868d511a #v2.25.4
        timeout-minutes: 1
        with:
          sarif_file: trivy.sarif
